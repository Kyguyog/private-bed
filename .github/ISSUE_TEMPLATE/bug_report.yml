name: Bug report
description: Report a problem with Private Bed.
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: '26.2'
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Private Bed, Fabric Loader, and Fabric API versions
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Dedicated server
        - World opened to LAN
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened and how can we reproduce it?
      description: Include expected behavior and whether LuckPerms is installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private coordinates, addresses, tokens, and player details before posting.
      render: text
