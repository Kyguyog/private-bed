name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: |
          python3 - <<'PYTHON'
          import json, os
          targets = json.load(open('targets.json'))
          matrix = {'include': [dict(target=name, **data) for name, data in targets.items()]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PYTHON
  build:
    needs: matrix
    name: ${{ matrix.loader }} / Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: ./gradlew --no-daemon --max-workers=2 "-Ptargets=$BUILD_TARGET" release
      - name: Upload mod jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-bed-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: |
            ${{ matrix.target }}/build/reports/tests/
            ${{ matrix.target }}/build/test-results/
          if-no-files-found: ignore
